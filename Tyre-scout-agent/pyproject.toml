[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tire-scout"
version = "0.1.0"
description = "Local tire technology scouting agent (LangChain/LangGraph, local LLM, sandboxed analysis)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-ollama>=1.0,<2",
    "ollama>=0.6,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Install only what the chosen configuration needs.
extraction = ["trafilatura>=1.8"]          # higher-quality web text extraction
ocr = ["pytesseract>=0.3.10", "pillow>=10"]# scanned-PDF OCR (requires Tesseract binary)
outlook = ["pywin32>=306"]                 # classic Outlook COM adapter (Windows only)
youtube = ["youtube-transcript-api>=0.6"]  # video transcripts where available
dev = ["pytest>=8"]

[project.scripts]
tire-scout = "tire_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tire_scout = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
