# ============================================================================
# Configuration for the Hybrid Zero-Degree Cord patent analysis pipeline
# ============================================================================

project:
  name: "Hybrid Zero-Degree Belt Cords in PCR Tires"
  # Date filtering is OFF: the pipeline analyzes the FULL export as-is, every
  # year included. The date scope is controlled entirely by what you export
  # from PatSeer. Set apply_year_filter: true (in `filtering`) and adjust the
  # range below only if you ever want the program to trim by year itself.
  year_start: 2015
  year_end: 2025

paths:
  raw_dir: "data/raw"          # drop CSV / XML / XLSX / PDF exports here
  interim_dir: "data/interim"  # normalized + filtered intermediate tables
  output_dir: "output"         # final report + figures + data matrices

filtering:
  # Take the full export as-is — do NOT trim by year inside the program.
  apply_year_filter: false
  # A patent is kept only if it looks like it concerns a circumferential
  # (zero-degree) belt/overlay AND a passenger-car radial (PCR) tire.
  require_zero_degree_signal: true
  require_pcr_signal: true
  # Hard-exclude clearly off-segment patents (truck/bus, off-road, aircraft).
  exclude_segments: ["TBR", "OTR", "AIRCRAFT"]

embedding:
  # Preferred model. Falls back to TF-IDF automatically if unavailable.
  model: "AI-Growth-Lab/PatentSBERTa"
  fallback_model: "sentence-transformers/all-mpnet-base-v2"
  batch_size: 32
  passage_max_chars: 1200      # passages longer than this are split

discovery:
  method: "bertopic"           # "bertopic" | "kmeans" (auto-fallback to kmeans)
  min_topic_size: 8
  n_clusters_fallback: 15      # used only by the kmeans fallback

report:
  title: "Hybrid Zero-Degree Cords for PCR Tires — Patent Landscape (2015–2025)"
  top_assignees: 15
  top_terms_per_cluster: 12
