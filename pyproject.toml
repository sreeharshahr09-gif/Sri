[project]
name = "data-analyst-agent"
version = "0.2.0"
description = "An LLM data analyst that writes, runs and checks pandas/Plotly code against your data."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit, so that newer ruff releases with wider default rule sets give the same result.
select = ["E4", "E7", "E9", "F"]
